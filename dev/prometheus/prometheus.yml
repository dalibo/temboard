scrape_configs:
- job_name: temboard
  scrape_interval: 60s
  scheme: http
  authorization:
    type: Bearer
    credentials: UNSECURE_DEV_APIKEY
  http_sd_configs:
  - url: http://host.docker.internal:8888/json/prometheus/targets
    authorization:
      type: Bearer
      credentials: UNSECURE_DEV_APIKEY
